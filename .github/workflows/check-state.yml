name: Check e Force Unlock (temporário)

on:
  workflow_dispatch: {}

jobs:
  check:
    name: Checar estado real e liberar lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Status real na AWS (fora do terraform)
        run: |
          echo "== EKS clusters =="
          aws eks list-clusters --output json
          echo "== EKS cluster oficina-eks (status) =="
          aws eks describe-cluster --name oficina-eks --query 'cluster.{status:status,endpoint:endpoint}' --output json 2>&1 || echo "describe-cluster falhou (cluster pode nao existir mais)"
          echo "== NAT Gateways =="
          aws ec2 describe-nat-gateways --filter "Name=tag:Name,Values=oficina-*" --query 'NatGateways[].{Id:NatGatewayId,State:State}' --output table
          echo "== VPCs =="
          aws ec2 describe-vpcs --filters "Name=tag:Name,Values=oficina-vpc" --query 'Vpcs[].VpcId' --output text
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - name: Plan destroy (com saida ao vivo via tee, sem buffer) + auto force-unlock se precisar
        run: |
          set +e
          terraform plan -destroy -no-color 2>&1 | tee plan.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ] && grep -q "Error acquiring the state lock" plan.log; then
            LOCKID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' plan.log | head -1)
            echo "Lock travado detectado (ID: $LOCKID) — liberando e tentando de novo..."
            terraform force-unlock -force "$LOCKID"
            terraform plan -destroy -no-color 2>&1 | tee plan.log
          fi
