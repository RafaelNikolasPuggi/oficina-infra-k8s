name: Check e Force Unlock (temporário)

on:
  workflow_dispatch: {}

jobs:
  check:
    name: Checar estado real e liberar lock
    runs-on: ubuntu-latest
    env:
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Status real na AWS (fora do terraform)
        run: |
          echo "== EKS clusters =="
          aws eks list-clusters --output json
          echo "== NAT Gateways =="
          aws ec2 describe-nat-gateways --filter "Name=tag:Name,Values=oficina-*" --query 'NatGateways[].{Id:NatGatewayId,State:State}' --output table
          echo "== VPCs =="
          aws ec2 describe-vpcs --filters "Name=tag:Name,Values=oficina-vpc" --query 'Vpcs[].VpcId' --output text
          echo "== O que ainda esta preso na VPC vpc-05b2f20620217c3c4 =="
          echo "-- Network Interfaces --"
          aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=vpc-05b2f20620217c3c4" \
            --query 'NetworkInterfaces[].{Id:NetworkInterfaceId,Status:Status,Desc:Description,Type:InterfaceType,Attachment:Attachment.InstanceOwnerId}' --output table
          echo "-- Security Groups --"
          aws ec2 describe-security-groups --filters "Name=vpc-id,Values=vpc-05b2f20620217c3c4" \
            --query 'SecurityGroups[].{Id:GroupId,Name:GroupName}' --output table
          echo "-- VPC Endpoints --"
          aws ec2 describe-vpc-endpoints --filters "Name=vpc-id,Values=vpc-05b2f20620217c3c4" \
            --query 'VpcEndpoints[].{Id:VpcEndpointId,State:State,Service:ServiceName}' --output table
          echo "-- Subnets restantes --"
          aws ec2 describe-subnets --filters "Name=vpc-id,Values=vpc-05b2f20620217c3c4" \
            --query 'Subnets[].SubnetId' --output table
          echo "-- Route tables restantes --"
          aws ec2 describe-route-tables --filters "Name=vpc-id,Values=vpc-05b2f20620217c3c4" \
            --query 'RouteTables[].RouteTableId' --output table
