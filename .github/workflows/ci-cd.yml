name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    name: Terraform Plan
    needs: validate
    if: github.event_name == 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan

  apply:
    name: Terraform Apply
    needs: validate
    # Só roda depois que o usuário configurar a conta AWS e os secrets — ver README.
    # Defina a variável de repositório AWS_DEPLOY_ENABLED=true quando estiver pronto.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Escalar o node group via AWS (o módulo ignora scaling_config[0].desired_size pós-criação)
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name /oficina/eks_cluster_name --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -n "$CLUSTER_NAME" ]; then
            NODEGROUP=$(aws eks list-nodegroups --cluster-name "$CLUSTER_NAME" --query 'nodegroups[0]' --output text 2>/dev/null || echo "None")
            if [ "$NODEGROUP" != "None" ] && [ -n "$NODEGROUP" ]; then
              CURRENT=$(aws eks describe-nodegroup --cluster-name "$CLUSTER_NAME" --nodegroup-name "$NODEGROUP" --query 'nodegroup.scalingConfig.desiredSize' --output text)
              # Precisa bater com node_min_size/node_desired_size/node_max_size em
              # variables.tf -- o terraform-aws-modules/eks ignora
              # scaling_config[0].desired_size depois da criação (lifecycle.ignore_changes,
              # pra não disputar com autoscaling), então mudar só a variável nunca escala
              # um node group já existente; precisa empurrar via API primeiro.
              if [ "$CURRENT" -lt 3 ]; then
                aws eks update-nodegroup-config --cluster-name "$CLUSTER_NAME" --nodegroup-name "$NODEGROUP" \
                  --scaling-config minSize=3,maxSize=4,desiredSize=3
                aws eks wait nodegroup-active --cluster-name "$CLUSTER_NAME" --nodegroup-name "$NODEGROUP"
              fi
            fi
          fi

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform apply -auto-approve
