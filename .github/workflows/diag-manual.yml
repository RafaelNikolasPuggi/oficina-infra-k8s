name: Diagnóstico manual (recursos presos nas 3 VPCs órfãs)

# Só roda manualmente. Investiga por que subnets/security groups das 3 VPCs
# órfãs continuam "em uso" mesmo depois do cleanup-manual.yml — ver histórico
# no README/ADR. Não deleta nada, só lista.
on:
  workflow_dispatch:

jobs:
  diag:
    name: Listar o que ainda depende das 3 VPCs órfãs
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Diagnóstico por VPC
        run: |
          set +e
          for VPC_ID in vpc-0149993a0ded3d18a vpc-08726120cb3d4b187 vpc-004137c44b4bf32c6; do
            echo "::group::VPC $VPC_ID"

            echo "-- ENIs --"
            aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'NetworkInterfaces[].{Id:NetworkInterfaceId,Status:Status,Desc:Description,Owner:RequesterId,Attach:Attachment.InstanceId}' --output table

            echo "-- Instâncias EC2 --"
            aws ec2 describe-instances --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'Reservations[].Instances[].{Id:InstanceId,State:State.Name,Type:InstanceType}' --output table

            echo "-- Subnets --"
            aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'Subnets[].{Id:SubnetId,AZ:AvailabilityZone,AvailableIps:AvailableIpAddressCount}' --output table

            echo "-- Security groups --"
            aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'SecurityGroups[].{Id:GroupId,Name:GroupName}' --output table

            echo "-- Route tables --"
            aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'RouteTables[].{Id:RouteTableId,Main:Associations[0].Main}' --output table

            echo "-- Internet gateways --"
            aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[].InternetGatewayId' --output text

            echo "-- NAT gateways --"
            aws ec2 describe-nat-gateways --filter "Name=vpc-id,Values=$VPC_ID" \
              --query 'NatGateways[].{Id:NatGatewayId,State:State}' --output table

            echo "::endgroup::"
          done

          echo "::group::Load Balancers (v2 - ALB/NLB)"
          aws elbv2 describe-load-balancers --query 'LoadBalancers[].{Arn:LoadBalancerArn,Name:LoadBalancerName,Vpc:VpcId,State:State.Code}' --output table
          echo "::endgroup::"

          echo "::group::Load Balancers (classic ELB)"
          aws elb describe-load-balancers --query 'LoadBalancerDescriptions[].{Name:LoadBalancerName,Vpc:VPCId}' --output table
          echo "::endgroup::"

          echo "::group::Auto Scaling Groups"
          aws autoscaling describe-auto-scaling-groups \
            --query 'AutoScalingGroups[].{Name:AutoScalingGroupName,Vpc:VPCZoneIdentifier,Desired:DesiredCapacity,Instances:length(Instances)}' --output table
          echo "::endgroup::"

          echo "::group::EKS clusters e nodegroups (confirmação)"
          aws eks list-clusters --output text
          echo "::endgroup::"
