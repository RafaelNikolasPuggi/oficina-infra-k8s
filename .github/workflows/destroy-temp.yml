name: Destroy (temporário)

on:
  workflow_dispatch: {}

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    env:
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: azure/setup-kubectl@v4

      - name: Apagar o cluster EKS orfao (existe na AWS mas o terraform nao sabe)
        run: |
          if aws eks describe-cluster --name oficina-eks >/dev/null 2>&1; then
            echo "Cluster oficina-eks encontrado (orfao no state) — verificando nodegroups..."
            NODEGROUPS=$(aws eks list-nodegroups --cluster-name oficina-eks --query 'nodegroups' --output text)
            if [ -n "$NODEGROUPS" ] && [ "$NODEGROUPS" != "None" ]; then
              for ng in $NODEGROUPS; do
                echo "Apagando nodegroup $ng..."
                aws eks delete-nodegroup --cluster-name oficina-eks --nodegroup-name "$ng"
                aws eks wait nodegroup-deleted --cluster-name oficina-eks --nodegroup-name "$ng"
              done
            else
              echo "Sem nodegroups — cluster vazio."
            fi
            echo "Apagando o cluster oficina-eks..."
            aws eks delete-cluster --name oficina-eks
            echo "Aguardando a AWS confirmar a exclusao do cluster (pode levar alguns minutos)..."
            aws eks wait cluster-deleted --name oficina-eks
            echo "Cluster oficina-eks apagado."
          else
            echo "Nenhum cluster oficina-eks encontrado — nada a fazer aqui."
          fi

      - name: Remover os LoadBalancers da aplicação (senão a VPC não destrói)
        run: |
          CLUSTER_NAME=$(aws eks list-clusters --query "clusters[?@=='oficina-eks']" --output text || echo "")
          if [ -n "$CLUSTER_NAME" ]; then
            aws eks update-kubeconfig --region ${{ vars.AWS_REGION || 'us-east-1' }} --name "$CLUSTER_NAME"
            kubectl delete svc oficina-os-app -n oficina-os --ignore-not-found --timeout=60s || true
            kubectl delete svc oficina-pagamento-app -n oficina-pagamento --ignore-not-found --timeout=60s || true
            echo "Esperando a AWS liberar os Load Balancers e ENIs associadas..."
            sleep 120
          else
            echo "Cluster oficina-eks nao encontrado — nada pra limpar."
          fi

      - name: Remover o Lambda de autenticação da VPC (ENI dele trava a exclusão das subnets)
        run: |
          aws lambda update-function-configuration \
            --function-name oficina-auth-cliente \
            --vpc-config '{"SubnetIds":[],"SecurityGroupIds":[]}' 2>/dev/null || true
          echo "Aguardando a AWS liberar a ENI do Lambda..."
          sleep 180

      - name: Apagar o security group orfao do lambda (travava a exclusao da VPC)
        run: |
          aws ec2 delete-security-group --group-id sg-0a04f899b5c7ebae9 2>&1 || echo "ja nao existe ou nao e mais esse id — segue o jogo"

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform destroy -input=false -auto-approve
