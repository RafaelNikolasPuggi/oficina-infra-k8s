name: Diagnóstico rápido (tipos de instância elegíveis para Free Tier)

# Só roda manualmente. Usado pontualmente para descobrir quais instance
# types esta conta AWS aceita, depois que um node group do EKS falhou com
# "not eligible for Free Tier" usando t3.medium — ver histórico no README.
on:
  workflow_dispatch:

jobs:
  check:
    name: Listar instance types free-tier-eligible em us-east-1
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Listar tipos free-tier-eligible
        run: |
          aws ec2 describe-instance-types \
            --filters "Name=free-tier-eligible,Values=true" \
            --query 'InstanceTypes[].{Type:InstanceType,vCPUs:VCpuInfo.DefaultVCpus,MemoryMiB:MemoryInfo.SizeInMiB}' \
            --output table
